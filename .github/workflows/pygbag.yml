name: pygbag_build

on:
  push:
    paths:
      - '**.py'
      - '**.spec'
      - '**.ini'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v2
    - name: Checkout
      run: |
            python -m pip install pygbag
            python -m pygbag --build --ume_block 0 $GITHUB_WORKSPACE/main.py
    
    - name : "Upload to GitHub pages branch gh-pages"
      uses: JamesIves/github-pages-deploy-action@4.1.7
      with:
        branch: gh-pages
        folder: build/web

    - name: Setup Butler
      uses: remarkablegames/setup-butler@v1

    - name: Publish HTML to itch.io via Butler
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      run: |
        butler push build/web shivamkr12/roaming-ralph:html --userversion web-v1.0.${{ github.run_number }}
